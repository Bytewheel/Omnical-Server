name: "CICD"
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write

env:
  RUST_VERSION: "1.97"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Checkout sources
        uses: actions/checkout@v4
      - run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Checkout sources
        uses: actions/checkout@v4
      - run: cargo test --all-features --verbose --workspace

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run tarpaulin
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        # Forks without a Coveralls token still run the coverage job; the
        # upload is skipped rather than failing the whole run.
        run: |
          if [ -n "$COVERALLS_REPO_TOKEN" ]; then
            cargo tarpaulin --workspace --all-features --exclude xml_derive --coveralls "$COVERALLS_REPO_TOKEN"
          else
            cargo tarpaulin --workspace --all-features --exclude xml_derive
          fi

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings
