{% extends "layouts/default.html" %}

{% block title %}{{ title }} · Omnical{% endblock %}

{% block content %}
<section class="event-form-page">
  <h1>{{ title }}</h1>
  <form method="POST" action="{{ action }}" class="event-form">
    {% if addressbooks.len() > 1 %}
    <label for="addressbook">Addressbook
      <select name="addressbook" id="addressbook" required>
        {% for ab in addressbooks %}
        <option value="{{ ab.value }}">{{ ab.label }}</option>
        {% endfor %}
      </select>
    </label>
    {% else %}
    {% for ab in addressbooks %}<input type="hidden" name="addressbook" value="{{ ab.value }}">{% endfor %}
    {% endif %}

    <label for="name">Name
      <input type="text" name="name" id="name" value="{{ name }}" required autofocus>
    </label>

    <label for="email">Email
      <input type="email" name="email" id="email" value="{{ email }}">
    </label>

    <label for="phone">Phone
      <input type="tel" name="phone" id="phone" value="{{ phone }}">
    </label>

    <label for="note">Note
      <textarea name="note" id="note" rows="4">{{ note }}</textarea>
    </label>

    <div class="form-actions">
      <button type="submit" class="primary">Save</button>
      <button type="button" onclick="history.back()">Cancel</button>
    </div>
  </form>
</section>
{% endblock %}
