{% extends "layouts/default.html" %}

{% block content %}

<div class="login_window">
  <h1>Change your password</h1>
  <p>
    Your password needs to be updated before you can continue. This happens the
    first time you join a shared calendar.
  </p>
  {% if let Some(error) = error %}
  <p class="error">{{ error }}</p>
  {% endif %}
  <form action="/frontend/user/{{ user.id }}/password" method="post" id="form_password_change">
    <div>
      <label>
        Current password
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
      </label>
    </div>
    <div>
      <label>
        New password
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="{{ min_password_length }}" required>
      </label>
    </div>
    <div>
      <label>
        Confirm new password
        <input type="password" id="new_password_confirm" name="new_password_confirm" autocomplete="new-password" required>
      </label>
    </div>
    <button type="submit" class="margin-top-m">Change password</button>
  </form>
</div>

{% endblock %}
