[package]
name = "rustical_store_sqlite"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
test = ["dep:rstest"]

[[bench]]
name = "insert_calendar_object"
harness = false
# The `test` feature is REQUIRED, not a convenience.
#
# `src/lib.rs:53-56` gates the `tests` module behind `#[cfg(any(test, feature =
# "test"))]`, and this bench's only source of a populated store is
# `rustical_store_sqlite::tests::test_store_context`. A bench target is NOT
# compiled with `cfg(test)` — that is a cargo rule, not an oversight — so
# `cargo bench -p rustical_store_sqlite --bench insert_calendar_object` fails:
#
#     error[E0432]: unresolved import `rustical_store_sqlite::tests`
#       --> crates/store_sqlite/benches/insert_calendar_object.rs:4:28
#        |
#     4 | use rustical_store_sqlite::tests::test_store_context;
#       |                            ^^^^^ could not find `tests` in `rustical_store_sqlite`
#
# This is why the bench has never produced a number: it does not build without
# the feature, and `required-features` is what makes the failure impossible
# rather than leaving it to whoever runs it next. It also keeps the feature out
# of the dependency graph of anything that merely depends on this crate —
# `dep:rstest` is dev-only, and a test-support feature leaking into a normal
# build would put rstest in front of everyone.
required-features = ["test"]

[dev-dependencies]
rstest.workspace = true
criterion.workspace = true
rustical_ical = { workspace = true, features = ["test"] }

[dependencies]
anyhow.workspace = true
caldata.workspace = true
argon2.workspace = true
tokio.workspace = true
rustical_store.workspace = true
async-trait.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
derive_more.workspace = true
chrono.workspace = true
password-auth.workspace = true
password-hash.workspace = true
uuid.workspace = true
pbkdf2.workspace = true
rustical_ical.workspace = true
rstest = { workspace = true, optional = true }
sha2.workspace = true
regex.workspace = true
rand.workspace = true
hex.workspace = true
rustical_dav_push.workspace = true
